name: E2E (Maestro)

on:
  push:
    branches: [main, quality]
  pull_request:
    branches: [main, quality]
  workflow_dispatch:

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare environment
        run: |
          cp .env.example .env
          # Absolute DATABASE_URL so the app and seed agree on the file.
          sed -i "s|file:./db/custom.db|file:$PWD/db/custom.db|" .env
          mkdir -p db && touch db/custom.db
          bunx prisma db push --accept-data-loss

      - name: Install Maestro
        run: |
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install Chrome + no-sandbox wrapper
        run: |
          # Maestro web needs a `chromium`/`google-chrome` binary. GH runners
          # ship Chrome; we wrap it to inject container-safe flags.
          CHROME_BIN="$(readlink -f "$(which google-chrome || which chromium || which chromium-browser)")"
          echo "Chrome at: $CHROME_BIN"
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/chromium" <<EOF
          #!/bin/bash
          exec "$CHROME_BIN" --no-sandbox --disable-gpu --disable-dev-shm-usage "\$@"
          EOF
          chmod +x "$HOME/.local/bin/chromium"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run E2E suite
        run: bash e2e/run.sh

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests/
          retention-days: 7
