# Public blog: index lists the launch posts and an article renders with
# markdown content, metadata and the shared trust footer.
url: ${MAESTRO_BASE_URL}/blog
name: Blog index and article render launch posts
tags:
  - e2e
  - public
  - blog
---
- launchApp

- extendedWaitUntil:
    visible: Evidence-grade signing, explained.
    timeout: 30000

# The index lists the six launch posts
- assertVisible: " ?Docurama is live.*"
- assertVisible: " ?eIDAS in five minutes.*"
- assertVisible: " ?How envelope seals work.*"
- assertVisible: " ?Self-hosting Docurama.*"

# Open the launch post
- tapOn: " ?Docurama is live.*"
- extendedWaitUntil:
    visible: " ?sign documents, prove everything.*"
    timeout: 15000
- assertVisible: Docurama Team

# Markdown body rendered (not raw markdown text)
- scrollUntilVisible:
    element: " ?What we built.*"
    direction: DOWN
    timeout: 15000

# The pricing table inside the post renders its rows
- scrollUntilVisible:
    element: " ?Smart Team.*"
    direction: DOWN
    timeout: 15000

- assertVisible: " ?All posts.*"
