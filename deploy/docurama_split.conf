# Cloud SaaS Upstream (Multi-Tenant Platform on docurama.eu / app.docurama.eu)
upstream docurama_cloud_upstream {
    server 172.17.0.1:3002;
}

# Enterprise Self-Host Upstream (StalFe Enterprise on docurama.stalfe.com)
upstream docurama_enterprise_upstream {
    server 172.17.0.1:3003;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name docurama.eu *.docurama.eu docurama.stalfe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# StalFe Enterprise Instance (https://docurama.stalfe.com) - Isolated Port 3003
# -----------------------------------------------------------------------------

server {
    listen 443 ssl;
    http2 on;
    server_name docurama.stalfe.com;

    ssl_certificate /etc/nginx/certs/stalfe-origin.pem;
    ssl_certificate_key /etc/nginx/certs/stalfe-origin-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 50m;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://docurama_enterprise_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# -----------------------------------------------------------------------------
# Cloud SaaS Platform (https://docurama.eu / app.docurama.eu) - Isolated Port 3002
# -----------------------------------------------------------------------------

