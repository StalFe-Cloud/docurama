      - ./custom_views/submit_form/email_2fa.html.erb:/app/app/views/submit_form/email_2fa.html.erb:ro
      - ./custom_views/submit_form/_banner.html.erb:/app/app/views/submit_form/_banner.html.erb:ro
      - ./custom_views/submit_form/_docuseal_logo.html.erb:/app/app/views/submit_form/_docuseal_logo.html.erb:ro
      - ./custom_views/users/_role_select.html.erb:/app/app/views/users/_role_select.html.erb:ro
      - ./custom_views/accounts/show.html.erb:/app/app/views/accounts/show.html.erb:ro
      - ./custom_views/profile/index.html.erb:/app/app/views/profile/index.html.erb:ro
      - ./custom_views/notifications_settings/index.html.erb:/app/app/views/notifications_settings/index.html.erb:ro
      - ./custom_views/api_settings/index.html.erb:/app/app/views/api_settings/index.html.erb:ro
      - ./custom_views/users/index.html.erb:/app/app/views/users/index.html.erb:ro
      - ./custom_views/mcp_settings/index.html.erb:/app/app/views/mcp_settings/index.html.erb:ro
      - ./custom_views/devise/sessions/new.html.erb:/app/app/views/devise/sessions/new.html.erb:ro
      - ./custom_views/devise/passwords/new.html.erb:/app/app/views/devise/passwords/new.html.erb:ro
      - ./custom_lib/docuseal.rb:/app/lib/docuseal.rb:ro
      - ./custom_views/errors/422.html:/app/app/views/errors/422.html:ro
      - ./custom_views/errors/422.html:/app/public/422.html:ro
      - ./custom_views/errors/500.html:/app/app/views/errors/500.html:ro
      - ./custom_views/errors/404.html:/app/app/views/errors/404.html:ro
