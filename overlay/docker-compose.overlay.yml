version: '3.8'

services:
  docurama:
    image: docuseal/docuseal:latest
    container_name: docurama
    restart: always
    depends_on:
      docurama-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@docurama-postgres:5432/${POSTGRES_DB}
      - HOST=${HOST}
      - APP_URL=https://${HOST}
      - PRODUCT_NAME=Docurama
      - FORCE_SSL=true
      - PORT=3000
      - TIMESERVER_URL=http://timestamp.digicert.com
    ports:
      - "0.0.0.0:3002:3000"
    volumes:
      - ./data:/app/data
      - ./custom_views/esign_settings/_default_signature_row.html.erb:/app/app/views/esign_settings/_default_signature_row.html.erb:ro
      - ./custom_views/esign_settings/show.html.erb:/app/app/views/esign_settings/show.html.erb:ro
      - ./custom_views/notifications_settings/_reminder_banner.html.erb:/app/app/views/notifications_settings/_reminder_banner.html.erb:ro
      - ./custom_views/notifications_settings/_reminder_placeholder.html.erb:/app/app/views/notifications_settings/_reminder_placeholder.html.erb:ro
      - ./custom_views/personalization_settings/_logo_placeholder.html.erb:/app/app/views/personalization_settings/_logo_placeholder.html.erb:ro
      - ./custom_views/sms_settings/_placeholder.html.erb:/app/app/views/sms_settings/_placeholder.html.erb:ro
      - ./custom_views/sms_settings/index.html.erb:/app/app/views/sms_settings/index.html.erb:ro
      - ./custom_views/sso_settings/_placeholder.html.erb:/app/app/views/sso_settings/_placeholder.html.erb:ro
      - ./custom_views/submissions/_bulk_send_placeholder.html.erb:/app/app/views/submissions/_bulk_send_placeholder.html.erb:ro
      - ./custom_views/submissions/_send_sms.html.erb:/app/app/views/submissions/_send_sms.html.erb:ro
      - ./custom_views/submissions/_send_sms_button.html.erb:/app/app/views/submissions/_send_sms_button.html.erb:ro
      - ./custom_views/templates_code_modal/_placeholder.html.erb:/app/app/views/templates_code_modal/_placeholder.html.erb:ro
      - ./custom_views/shared/_settings_nav.html.erb:/app/app/views/shared/_settings_nav.html.erb:ro
      - ./custom_views/shared/_logo.html.erb:/app/app/views/shared/_logo.html.erb:ro
      - ./custom_views/shared/_title.html.erb:/app/app/views/shared/_title.html.erb:ro
      - ./custom_views/shared/_powered_by.html.erb:/app/app/views/shared/_powered_by.html.erb:ro
      - ./custom_views/shared/_attribution.html.erb:/app/app/views/shared/_attribution.html.erb:ro
      - ./custom_views/shared/_email_attribution.html.erb:/app/app/views/shared/_email_attribution.html.erb:ro
      - ./custom_views/shared/_mailer_attribution.html.erb:/app/app/views/shared/_mailer_attribution.html.erb:ro
      - ./custom_views/shared/_github.html.erb:/app/app/views/shared/_github.html.erb:ro
      - ./custom_views/shared/_github_button.html.erb:/app/app/views/shared/_github_button.html.erb:ro
      - ./custom_views/shared/_navbar.html.erb:/app/app/views/shared/_navbar.html.erb:ro
      - ./custom_views/shared/_navbar_buttons.html.erb:/app/app/views/shared/_navbar_buttons.html.erb:ro
      - ./custom_views/shared/_meta.html.erb:/app/app/views/shared/_meta.html.erb:ro
      - ./custom_views/layouts/_head_tags.html.erb:/app/app/views/layouts/_head_tags.html.erb:ro
