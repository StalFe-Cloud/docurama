      - ./custom_views/errors/404.html:/app/public/404.html:ro
      - ./custom_controllers/errors_controller.rb:/app/app/controllers/errors_controller.rb:ro
      - ./custom_config/initializers/session_store.rb:/app/config/initializers/session_store.rb:ro
      - ./custom_controllers/esign_settings_controller.rb:/app/app/controllers/esign_settings_controller.rb:ro
      - ./custom_config/locales/i18n.yml:/app/config/locales/i18n.yml:ro
      - ./custom_public/favicon.svg:/app/public/favicon.svg:ro
      - ./custom_public/preview.png:/app/public/preview.png:ro
      - ./custom_public/apple-touch-icon.png:/app/public/apple-touch-icon.png:ro
      - ./custom_public/favicon.png:/app/public/favicon.png:ro
      - ./custom_public/favicon.ico:/app/public/favicon.ico:ro
      - ./custom_public/logo.svg:/app/public/logo.svg:ro
      - ./custom_packs:/app/public/packs:ro
      - ./custom_lib/submissions/generate_audit_trail.rb:/app/lib/submissions/generate_audit_trail.rb:ro
      - ./custom_pdf_icons/logo.png:/app/lib/pdf_icons/logo.png:ro
      - ./custom_pdf_icons/stamp-logo.png:/app/lib/pdf_icons/stamp-logo.png:ro
      - ./custom_views/templates_share_link_qr/show.html.erb:/app/app/views/templates_share_link_qr/show.html.erb:ro
      - ./custom_views/verify_pdf_signature/index.html.erb:/app/app/views/verify_pdf_signature/index.html.erb:ro
      - ./custom_controllers/verify_pdf_signature_controller.rb:/app/app/controllers/verify_pdf_signature_controller.rb:ro
      - ./custom_config/routes.rb:/app/config/routes.rb:ro
      - ./custom_public/docurama-theme.css:/app/public/docurama-theme.css:ro
    networks:
      - docurama_net

  docurama-postgres:
    image: postgres:16-alpine
    container_name: docurama-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docurama_net

networks:
  docurama_net:
    driver: bridge
