# Gitleaks configuration for Docurama
# Extends default gitleaks rules and configures project allowlists.

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for documentation examples, test fixtures, and plan docs"
paths = [
    '''frontend/src/pages/ApiDocsPage\.tsx''',
    '''backend/tests/.*''',
    '''docs/.*''',
]
stopwords = [
    "YOUR_API_KEY",
    "dcr_vfy_abc123",
    "dcr_wh_sec_12345",
]
