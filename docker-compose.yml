services:
  docurama-db:
    image: postgres:16-alpine
    container_name: docurama-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docurama}
      POSTGRES_USER: ${POSTGRES_USER:-docurama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - docurama_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docurama} -d ${POSTGRES_DB:-docurama}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docurama_net

  docurama-api:
    build:
      # Repository-root context so backend/Dockerfile can COPY scripts/ (the
      # operator scripts) into the API image.
      context: .
      dockerfile: backend/Dockerfile
    container_name: docurama-api
    restart: always
    env_file:
      - .env
    environment:
      DOCURAMA_STORAGE_DIR: "/app/storage"
      # Trust X-Forwarded-For from the nginx container so audit events record the
      # real signer IP. The API port is not published to the host.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    volumes:
      - docurama_storage:/app/storage
      # Signing keys stay on the host, out of image layers and build cache.
      - ./backend/certs:/app/certs:ro
    depends_on:
      docurama-db:
        condition: service_healthy
    # Readiness is enforced by the image HEALTHCHECK (backend/Dockerfile), which
    # gates on /readyz: 503 while the signing certificate is missing, unreadable
    # or expired, so a deployment that would complete every envelope unsealed is
    # never declared healthy.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - docurama_net

  docurama:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docurama
    restart: always
    ports:
      - "0.0.0.0:3002:3000"
    depends_on:
      - docurama-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - docurama_net

volumes:
  docurama_db_data:
  docurama_storage:

networks:
  docurama_net:
    driver: bridge
