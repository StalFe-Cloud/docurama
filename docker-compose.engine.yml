version: '3.8'

services:
  docurama:
    build:
      context: .
      dockerfile: Dockerfile
    image: docurama:latest
    container_name: docurama
    restart: always
    depends_on:
      docurama-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@docurama-postgres:5432/${POSTGRES_DB}
      - HOST=${HOST}
      - APP_URL=https://${HOST}
      - PRODUCT_NAME=Docurama
      - FORCE_SSL=true
      - PORT=3000
      - TIMESERVER_URL=http://timestamp.digicert.com
    ports:
      - "0.0.0.0:3002:3000"
    volumes:
      - ./data:/app/data
    networks:
      - docurama_net

  docurama-postgres:
    image: postgres:16-alpine
    container_name: docurama-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docurama_net

networks:
  docurama_net:
    driver: bridge
