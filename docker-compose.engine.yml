version: '3.8'

services:
  docurama:
    build:
      context: .
      dockerfile: Dockerfile
    image: docurama:latest
    container_name: docurama
    restart: always
    depends_on:
      docurama-postgres:
        condition: service_healthy
    environment:
      - DOCURAMA_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-docurama}:${POSTGRES_PASSWORD:-docurama_secure_db_pass_2026}@docurama-postgres:5432/${POSTGRES_DB:-docurama}
      - DOCURAMA_APP_URL=https://${HOST:-docurama.example.com}
      - DOCURAMA_STORAGE_DIR=/app/storage
      - DOCURAMA_SECRET_KEY=${DOCURAMA_SECRET_KEY:?generate one, python -c "import secrets; print(secrets.token_urlsafe(48))"}
      - DOCURAMA_TSA_URL=http://timestamp.digicert.com
    ports:
      - "0.0.0.0:3002:8000"
    volumes:
      - ./data/storage:/app/storage
      # Signing keys stay on the host, out of image layers and build cache.
      - ./backend/certs:/app/certs:ro
    networks:
      - docurama_net

  docurama-postgres:
    image: postgres:16-alpine
    container_name: docurama-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docurama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docurama_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-docurama}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docurama} -d ${POSTGRES_DB:-docurama}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docurama_net

networks:
  docurama_net:
    driver: bridge
